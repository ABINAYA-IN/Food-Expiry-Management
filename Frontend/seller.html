<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreshTrack - Seller Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f8f4;
            color: #26352b;
        }

        header {
            background: #2e7d32;
            color: white;
            padding: 18px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        header h1 {
            margin: 0;
        }

        nav {
            display: flex;
            gap: 18px;
            flex-wrap: wrap;
        }

        nav a {
            color: white;
            text-decoration: none;
        }

        nav a:hover {
            text-decoration: underline;
        }

        .container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 15px;
        }

        .card {
            background: white;
            padding: 25px;
            margin-bottom: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 12px #00000010;
        }

        h2 {
            color: #2e7d32;
            margin-top: 0;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 7px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        select {
    width: 100%;
    padding: 12px;
    margin-top: 7px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 15px;
    background: white;
}

        button {
            padding: 10px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 12px;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .primary-btn {
            background: #2e7d32;
            color: white;
            width: 100%;
        }

        .edit-btn {
            background: #1976d2;
            color: white;
            margin-right: 5px;
        }

        .delete-btn {
            background: #d32f2f;
            color: white;
        }

        .cancel-btn {
            background: #757575;
            color: white;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .product-card {
            border: 1px solid #e0e0e0;
            padding: 15px;
            border-radius: 10px;
            background: white;
            overflow-wrap: anywhere;
        }

        .product-image {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 8px;
            background: #eee;
        }

        .no-image {
            height: 180px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #eee;
            color: #666;
            border-radius: 8px;
        }

        .product-card h3 {
            color: #2e7d32;
        }

        .product-card p {
            margin: 8px 0;
            font-size: 14px;
        }

        .message {
            margin-top: 15px;
            font-weight: bold;
            overflow-wrap: anywhere;
        }

        .success {
            color: #2e7d32;
        }

        .error {
            color: #d32f2f;
        }

        #imagePreview {
            display: none;
            width: 150px;
            height: 150px;
            object-fit: cover;
            margin-top: 12px;
            border-radius: 8px;
        }

        .expiry-warning {
            color: #e65100;
            font-weight: bold;
        }

        @media (max-width: 600px) {
            header {
                padding: 16px;
            }

            .container {
                margin: 15px auto;
            }

            .card {
                padding: 18px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>FreshTrack</h1>

    <nav>
        <a href="index.html">Home</a>
        <a href="products.html">Products</a>
        <a href="login.html">Logout</a>
        <a href="seller-orders.html">Manage Orders</a>
    </nav>
</header>

<main class="container">

    <!-- ADD / EDIT PRODUCT FORM -->
    <section class="card">
        <h2 id="formTitle">Add New Product</h2>

        <form id="productForm">

            <label for="foodName">Product Name</label>
            <input
                type="text"
                id="foodName"
                placeholder="Example: Fresh Apples"
                required
            >

            <label for="productImage">Product Image</label>
            <input
                type="file"
                id="productImage"
                accept="image/jpeg,image/png,image/webp"
            >

            <small>
                For a new product, select an image.
                While editing, leave it empty to keep the existing image.
            </small>

            <img id="imagePreview" alt="Product preview">

            <label for="expiryDate">Expiry Date</label>
            <input type="date" id="expiryDate" required>

            <label for="price">Price (₹)</label>
            <input
                type="number"
                id="price"
                min="0.01"
                step="0.01"
                placeholder="Enter price"
                required
            >
            <label for="unit">Product Unit</label>
<select id="unit" name="unit" required>
    <option value="">Select Unit</option>
    <option value="kg">Kilogram (kg)</option>
    <option value="g">Gram (g)</option>
    <option value="litre">Litre</option>
    <option value="ml">Millilitre (ml)</option>
    <option value="piece">Piece</option>
    <option value="pack">Pack</option>
</select>

            <button type="submit" class="primary-btn" id="saveButton">
                Add Product
            </button>

            <button
                type="button"
                class="cancel-btn"
                id="cancelEditButton"
                hidden
            >
                Cancel Edit
            </button>

            <div id="formMessage" class="message" role="status"></div>

        </form>
    </section>

    <!-- SELLER PRODUCT LIST -->
    <section class="card">
        <h2>My Products</h2>

        <p>View, edit, or delete your products below.</p>

        <button type="button" class="edit-btn" id="refreshButton">
            Refresh Products
        </button>

        <div id="productMessage" class="message" role="status"></div>

        <div id="productList" class="product-grid">
            Loading products...
        </div>
    </section>

</main>

<script>
    const API_URL = "http://localhost:8080/api/products";
    const IMAGE_UPLOAD_URL = "http://localhost:8080/api/images/upload";
    const IMAGE_BASE_URL = "http://localhost:8080/api/images/";

    const productForm = document.getElementById("productForm");
    const foodNameInput = document.getElementById("foodName");
    const expiryDateInput = document.getElementById("expiryDate");
    const priceInput = document.getElementById("price");
    const productImageInput = document.getElementById("productImage");
    const imagePreview = document.getElementById("imagePreview");
    const saveButton = document.getElementById("saveButton");
    const cancelEditButton = document.getElementById("cancelEditButton");
    const formTitle = document.getElementById("formTitle");
    const formMessage = document.getElementById("formMessage");
    const productMessage = document.getElementById("productMessage");
    const productList = document.getElementById("productList");

    let editingProductId = null;
    let existingImageName = null;

    // Display messages safely.
    function showMessage(element, message, type = "") {
        element.textContent = message;
        element.className = "message " + type;
    }

    // Format dates consistently without timezone shifting.
    function formatDate(dateValue) {
        if (!dateValue) {
            return "Not available";
        }

        const parts = String(dateValue).split("-");

        if (parts.length === 3) {
            return `${parts[2]}/${parts[1]}/${parts[0]}`;
        }

        return dateValue;
    }

    function formatAddedDate(dateValue) {
        if (!dateValue) {
            return "Not recorded";
        }

        const parsed = new Date(dateValue);

        if (Number.isNaN(parsed.getTime())) {
            return String(dateValue);
        }

        return parsed.toLocaleString();
    }

    // Image preview.
    productImageInput.addEventListener("change", function () {
        const file = this.files[0];

        if (!file) {
            if (editingProductId && existingImageName) {
                imagePreview.src =
                    IMAGE_BASE_URL + encodeURIComponent(existingImageName);
                imagePreview.style.display = "block";
            } else {
                imagePreview.removeAttribute("src");
                imagePreview.style.display = "none";
            }
            return;
        }

        const allowedTypes = [
            "image/jpeg",
            "image/png",
            "image/webp"
        ];

        if (!allowedTypes.includes(file.type)) {
            alert("Select a JPG, PNG, or WEBP image.");
            this.value = "";
            return;
        }

        if (file.size > 5 * 1024 * 1024) {
            alert("Image must be smaller than 5 MB.");
            this.value = "";
            return;
        }

        imagePreview.src = URL.createObjectURL(file);
        imagePreview.style.display = "block";
    });

    // Upload image to backend.
    async function uploadImage(file) {
        const formData = new FormData();
        formData.append("image", file);

        const response = await fetch(IMAGE_UPLOAD_URL, {
            method: "POST",
            body: formData
        });

        if (!response.ok) {
            const errorText = await response.text();
            throw new Error("Image upload failed: " + errorText);
        }

        const result = await response.json();

        if (!result.imageName) {
            throw new Error("Backend did not return the image filename.");
        }

        return result.imageName;
    }

    // Add or edit a product.
    productForm.addEventListener("submit", async function (event) {
        event.preventDefault();

        const name = foodNameInput.value.trim();
        const expiryDate = expiryDateInput.value;
        const price = Number(priceInput.value);
        const imageFile = productImageInput.files[0];

        if (!name || !expiryDate || !Number.isFinite(price) || price <= 0) {
            showMessage(formMessage, "Enter valid product details.", "error");
            return;
        }

        if (editingProductId === null && !imageFile) {
            showMessage(formMessage, "Please select a product image.", "error");
            return;
        }

        saveButton.disabled = true;
        showMessage(formMessage, "Saving product...");

        try {
            let imageName = existingImageName;

            if (imageFile) {
                imageName = await uploadImage(imageFile);
            }

            const productData = {
    name: name,
    expiryDate: expiryDate,
    price: price,
    unit: document.getElementById("unit").value,
    imageName: imageName
};

            const isEditing = editingProductId !== null;

            const url = isEditing
                ? `${API_URL}/${encodeURIComponent(editingProductId)}`
                : API_URL;

            const response = await fetch(url, {
                method: isEditing ? "PUT" : "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(productData)
            });

            if (!response.ok) {
                const errorText = await response.text();

                throw new Error(
                    (isEditing ? "Update failed: " : "Add failed: ") +
                    errorText
                );
            }

            showMessage(
                formMessage,
                isEditing
                    ? "Product updated successfully!"
                    : "Product added successfully!",
                "success"
            );

            resetForm();
            await loadProducts();

        } catch (error) {
            console.error("Save product error:", error);

            showMessage(
                formMessage,
                error.message || "Unable to save product.",
                "error"
            );

        } finally {
            saveButton.disabled = false;
        }
    });

    // Reset form and exit edit mode.
    function resetForm() {
        productForm.reset();

        editingProductId = null;
        existingImageName = null;

        imagePreview.removeAttribute("src");
        imagePreview.style.display = "none";

        formTitle.textContent = "Add New Product";
        saveButton.textContent = "Add Product";
        cancelEditButton.hidden = true;

        productImageInput.required = true;
    }

    cancelEditButton.addEventListener("click", function () {
        resetForm();
        showMessage(formMessage, "");
    });

    // Populate form with selected product.
    function editProduct(product) {
        editingProductId = product.id;
        existingImageName = product.imageName || null;

        foodNameInput.value = product.name || product.name || "";
        expiryDateInput.value = product.expiryDate || "";
        priceInput.value = product.price ?? "";
        document.getElementById("unit").value = product.unit || "";

        productImageInput.value = "";
        productImageInput.required = false;

        if (existingImageName) {
            imagePreview.src =
                IMAGE_BASE_URL + encodeURIComponent(existingImageName);
            imagePreview.style.display = "block";
        } else {
            imagePreview.removeAttribute("src");
            imagePreview.style.display = "none";
        }

        formTitle.textContent = "Edit Product";
        saveButton.textContent = "Update Product";
        cancelEditButton.hidden = false;

        showMessage(
            formMessage,
            "Editing: " + (product.name || product.name || "Product")
        );

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });
    }

    // Create a product card.
    function createProductCard(product) {
        const card = document.createElement("article");
        card.className = "product-card";

        if (product.imageName) {
            const img = document.createElement("img");

            img.className = "product-image";
            img.src =
                IMAGE_BASE_URL + encodeURIComponent(product.imageName);
            img.alt = product.name || product.name || "Product image";

            img.onerror = function () {
                img.style.display = "none";
            };

            card.appendChild(img);
        } else {
            const noImage = document.createElement("div");
            noImage.className = "no-image";
            noImage.textContent = "No image available";
            card.appendChild(noImage);
        }

        const title = document.createElement("h3");
        title.textContent = product.name || product.name || "Unnamed Product";
        card.appendChild(title);
        const price = document.createElement("p");

        price.textContent =
        "Price: ₹" + (product.price ?? "Not available");

        card.appendChild(price);

       const unit = document.createElement("p");

unit.textContent =
    "Unit: " + (product.unit || "Not set");

card.appendChild(unit);

        const expiry = document.createElement("p");
        expiry.textContent = "Expiry Date: " + formatDate(product.expiryDate);
        card.appendChild(expiry);

        // Shows the actual added timestamp if the backend provides one.
        const addedDate =
            product.addedDate ||
            product.createdAt ||
            product.createdDate;

        const added = document.createElement("p");
        added.textContent = "Added Date: " + formatAddedDate(addedDate);
        card.appendChild(added);

        const editButton = document.createElement("button");
        editButton.type = "button";
        editButton.className = "edit-btn";
        editButton.textContent = "Edit";

        editButton.addEventListener("click", function () {
            editProduct(product);
        });

        card.appendChild(editButton);

        const deleteButton = document.createElement("button");
        deleteButton.type = "button";
        deleteButton.className = "delete-btn";
        deleteButton.textContent = "Delete";

        deleteButton.addEventListener("click", function () {
            deleteProduct(product.id, deleteButton);
        });

        card.appendChild(deleteButton);

        return card;
    }

    // Load products from backend.
    async function loadProducts() {
        productList.textContent = "Loading products...";
        showMessage(productMessage, "");

        try {
            const response = await fetch(API_URL);

            if (!response.ok) {
                throw new Error("Could not load products.");
            }

            const products = await response.json();

            productList.replaceChildren();

            if (!Array.isArray(products) || products.length === 0) {
                productList.textContent = "No products added yet.";
                return;
            }

            products.forEach(function (product) {
                productList.appendChild(createProductCard(product));
            });

        } catch (error) {
            console.error("Load products error:", error);

            productList.textContent = "Unable to load products.";
            showMessage(
                productMessage,
                "Check the backend and API connection.",
                "error"
            );
        }
    }

    // Delete a product.
    async function deleteProduct(id, button) {
        if (id === undefined || id === null) {
            alert("Product ID is missing.");
            return;
        }

        if (!confirm("Are you sure you want to delete this product?")) {
            return;
        }

        button.disabled = true;
        button.textContent = "Deleting...";

        try {
            const response = await fetch(
                `${API_URL}/${encodeURIComponent(id)}`,
                { method: "DELETE" }
            );

            if (!response.ok) {
                const errorText = await response.text();
                throw new Error(errorText || "Product deletion failed.");
            }

            showMessage(productMessage, "Product deleted successfully.", "success");

            if (String(editingProductId) === String(id)) {
                resetForm();
            }

            await loadProducts();

        } catch (error) {
            console.error("Delete product error:", error);

            showMessage(
                productMessage,
                "Unable to delete product. " + error.message,
                "error"
            );

            button.disabled = false;
            button.textContent = "Delete";
        }
    }

    document.getElementById("refreshButton").addEventListener(
        "click",
        loadProducts
    );

    // Load the seller's products when the page opens.
    loadProducts();
</script>

</body>
</html>
