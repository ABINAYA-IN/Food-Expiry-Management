<!DOCTYPE html>
<html lang="en">
   <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Food Expiry Management System</title>
      <link rel="stylesheet" href="style.css">
   </head>
   <body>
   <header>
    <h1>Food Expiry Management System</h1>
    <p>Welcome to the Food Expiry Management System. Manage your food products and expiry dates easily.</p>
   </header>
   <div class="container">
    <h2>Add Food Product</h2>
    <form id="foodForm">
        <label for="foodName">Food Name:</label>
        <input type="text" id="foodName" placeholder="Enter food name" required>
        <label for="expiryDate">Expiry Date:</label>
        <input type="date" id="expiryDate" required>
        <label for="price">Price ($)</label>
        <input type="number" id="price" placeholder="Enter price" min="0.01" step="0.01" required>
        <button type="submit">Add Product</button>
    </form>
    <h2>Food Products</h2>
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Food Name</th>
                    <th>Expiry Date</th>
                    <th>Price ($)</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="foodList">
                <!-- Food product rows will be added here dynamically -->
            </tbody>
        </table>
    </div>
    <p id="message"></p>
   </div>
   <script src="script.js"></script>
   </body>
</html>
