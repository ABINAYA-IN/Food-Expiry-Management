<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Successful | FreshTrack</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f0f8f2;
        }

        .success-card {
            width: 100%;
            max-width: 450px;
            padding: 40px 25px;
            text-align: center;
            background: white;
            border-radius: 18px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
        }

        .checkmark {
            width: 85px;
            height: 85px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: #dcfce7;
            color: #15803d;
            font-size: 48px;
        }

        h1 {
            color: #166534;
            margin-bottom: 10px;
        }

        p {
            color: #555;
            line-height: 1.6;
        }

        .order-details {
            margin: 25px 0;
            padding: 15px;
            text-align: left;
            background: #f8fafc;
            border-radius: 10px;
        }

        .order-details p {
            margin: 8px 0;
            overflow-wrap: anywhere;
        }

        .buttons a {
            display: block;
            margin-top: 12px;
            padding: 13px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
        }

        .track-btn {
            color: white;
            background: #15803d;
        }

        .home-btn {
            color: #166534;
            border: 1px solid #15803d;
        }
    </style>
</head>

<body>
    <div class="success-card">
        <div class="checkmark">✓</div>

        <h1>Order Placed Successfully!</h1>

        <p>Thank you for shopping with FreshTrack.</p>
        <p>Your order has been received successfully.</p>

        <div class="order-details">
            <p><strong>Order ID:</strong> <span id="orderId">Not available</span></p>
            <p><strong>Payment Method:</strong> <span id="paymentMethod">Not available</span></p>
            <p><strong>Status:</strong> PLACED</p>
        </div>

        <div class="buttons">
            <a href="index.html" class="home-btn">← Back to Home</a>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);

        document.getElementById("orderId").textContent =
            params.get("orderId") || "Not available";

        document.getElementById("paymentMethod").textContent =
            params.get("paymentMethod") || "Not available";
    </script>
</body>
</html>
